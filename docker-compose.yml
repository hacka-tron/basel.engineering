services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: glassbox
      MYSQL_USER: glassbox
      MYSQL_PASSWORD: glassbox
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:7.2.0-v11
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: glassbox
      MYSQL_PASSWORD: glassbox
      MYSQL_DATABASE: glassbox
      REDIS_URL: redis://redis:6379/0
      GLASSBOX_PROVIDER: ${GLASSBOX_PROVIDER:-fake}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_EMBEDDING_MODEL_ID: ${BEDROCK_EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
      BEDROCK_LLM_MODEL_ID: ${BEDROCK_LLM_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      GLASSBOX_DAILY_LLM_CAP: ${GLASSBOX_DAILY_LLM_CAP:-100}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
