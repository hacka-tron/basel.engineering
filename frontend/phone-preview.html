<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phone preview</title>
    <!-- Dev-only page (not part of the build; vite builds index.html only).
         Run `npm run phone` and open /phone-preview.html. See
         project/MOBILE_DESIGN.md "Manual phone preview". -->
    <style>
      body { margin: 0; background: #2a2d34; font: 13px system-ui, sans-serif; color: #ccc; }
      main { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start; padding: 24px; }
      figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .frame { border: 12px solid #000; border-radius: 40px; overflow: hidden; background: #000; box-shadow: 0 10px 40px #0008; }
      iframe { border: 0; display: block; }
      p { text-align: center; margin: 16px 0 0; }
    </style>
  </head>
  <body>
    <p>Each frame is an independent page. Press and hold works with the mouse; touch-only behaviour (keyboard resize) needs a real phone.</p>
    <main>
      <figure><figcaption>iPhone 15 · 393×852</figcaption><div class="frame"><iframe src="/" width="393" height="852" title="iPhone 15"></iframe></div></figure>
      <figure><figcaption>iPhone SE · 375×667</figcaption><div class="frame"><iframe src="/" width="375" height="667" title="iPhone SE"></iframe></div></figure>
      <figure><figcaption>Narrow Android · 360×780</figcaption><div class="frame"><iframe src="/" width="360" height="780" title="Narrow Android"></iframe></div></figure>
      <figure><figcaption>Smallest · 320×568</figcaption><div class="frame"><iframe src="/" width="320" height="568" title="Smallest phone"></iframe></div></figure>
      <figure><figcaption>Fold cover screen · 280×653 (name shortens below 292)</figcaption><div class="frame"><iframe src="/" width="280" height="653" title="Fold cover screen"></iframe></div></figure>
    </main>
  </body>
</html>
