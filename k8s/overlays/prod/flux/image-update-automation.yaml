apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: glassbox
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: deploy
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        deploy: bump image to {{range .Updated.Images}}{{println .}}{{end}}
    push:
      branch: deploy
  update:
    path: ./k8s/overlays/prod
    strategy: Setters
