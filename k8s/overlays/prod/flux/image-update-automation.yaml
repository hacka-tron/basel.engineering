apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: glassbox
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: deploy
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      # A static message, not a template referencing .Updated/.Changed: the
      # exact template field shape has changed across Flux versions (found
      # the hard way - .Updated is removed in the version bootstrapped
      # here), and the commit diff itself already shows exactly which tag
      # changed, so there's nothing a dynamic message adds.
      messageTemplate: "deploy: automated image tag update"
    push:
      branch: deploy
  update:
    path: ./k8s/overlays/prod
    strategy: Setters
