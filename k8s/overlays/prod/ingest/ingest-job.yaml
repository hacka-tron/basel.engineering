apiVersion: batch/v1
kind: Job
metadata:
  name: ingest
  namespace: app
  annotations:
    # See k8s/base/migrate-job.yaml - Job pod templates are immutable, so any image
    # tag change needs Flux to delete and recreate rather than patch. This
    # annotation's value is a string enum ("enabled"/"disabled"), NOT a
    # boolean - Flux's Kustomization.spec.force field is a real boolean, but
    # this per-resource annotation is not the same knob and silently no-ops
    # on "true" (confirmed: https://fluxcd.io/flux/components/kustomize/kustomizations/).
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ingest
        # Lets the warm-up at the end of this Job reach the api
        # (base/networkpolicy-app.yaml, api-from-answer-warmer).
        glassbox/answer-warmer: "true"
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: regcred
      containers:
        - name: ingest
          image: 404379474987.dkr.ecr.us-east-1.amazonaws.com/glassbox:latest
          # After ingesting, refill the suggested questions' answer cache
          # (a changed corpus invalidates it). A warm-up failure is logged and
          # never fails the Job, so it can't block or retry ingestion.
          command:
            - sh
            - -c
            - >-
              python -m services.glassbox.ingest.run &&
              { python -m services.glassbox.warm --api-url http://api.app.svc.cluster.local
              || echo "answer-cache warm-up failed (ignored)"; }
          envFrom:
            - configMapRef:
                name: glassbox-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glassbox-mysql
                  key: mysql-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
