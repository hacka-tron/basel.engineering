apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: app
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-traefik
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
---
# The answer-cache warm-up (warm-cronjob.yaml, and the tail of the ingest Job
# after each deploy) calls the api Service in-cluster. Only pods carrying the
# warmer label, in this namespace, on the api's port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-answer-warmer
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              glassbox/answer-warmer: "true"
      ports:
        - protocol: TCP
          port: 8000
