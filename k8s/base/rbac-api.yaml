# Tightly-scoped ServiceAccount + Role + RoleBinding for the api Deployment's
# cluster view (DESIGN.md §9.5): read-only on pods, this namespace only.
# GET /api/cluster/stream (services/glassbox/api/cluster.py) uses this
# ServiceAccount's mounted token to list/watch retrieval-worker pods and
# forwards only name/phase/ready — nothing else leaves the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-viewer
  namespace: app
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-pod-viewer
  namespace: app
subjects:
  - kind: ServiceAccount
    name: api
    namespace: app
roleRef:
  kind: Role
  name: pod-viewer
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-scoped read for GET /api/demo/capacity (services/glassbox/api/
# capacity.py), which lists nodes to compare allocatable memory and the
# MemoryPressure condition against the stress test's estimated peak. Nodes
# are cluster-scoped, so a namespaced Role can't grant this. `list` only —
# the capacity check never gets a node by name, watches, or writes, and
# resourceNames can't narrow it further since the EC2-assigned node name
# isn't known ahead of time. Approved by the owner 2026-09-30.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glassbox-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  # Live node memory usage from metrics-server (bundled with k3s), so the
  # capacity check compares against free memory, not total allocatable.
  # Usage numbers only; owner-approved 2026-09-30.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glassbox-api-node-reader
subjects:
  - kind: ServiceAccount
    name: api
    namespace: app
roleRef:
  kind: ClusterRole
  name: glassbox-node-reader
  apiGroup: rbac.authorization.k8s.io
