apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-worker
  namespace: app
spec:
  # No `replicas` field: KEDA's ScaledObject (k8s/overlays/prod/
  # scaledobject-retrieval-worker.yaml) manages this Deployment's replica
  # count via the HPA it creates, scaling 1 to 3 on retrieval:jobs' consumer-
  # group lag. Leaving a fixed `replicas` here would have kubectl/Flux
  # reassert it on every apply, fighting the HPA. Baseline is
  # minReplicaCount: 1 there, matching DESIGN.md §9.2's steady state.
  selector:
    matchLabels:
      app: retrieval-worker
  template:
    metadata:
      labels:
        app: retrieval-worker
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: worker
          image: 404379474987.dkr.ecr.us-east-1.amazonaws.com/glassbox:latest
          command: ["python", "-m", "services.glassbox.worker.main"]
          envFrom:
            - configMapRef:
                name: glassbox-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glassbox-mysql
                  key: mysql-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
