apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-worker
  namespace: app
spec:
  # No `replicas` field: KEDA's ScaledObject (k8s/overlays/prod/
  # scaledobject-retrieval-worker.yaml) manages this Deployment's replica
  # count via the HPA it creates, scaling 1 to 3 on retrieval:jobs' consumer-
  # group lag. Leaving a fixed `replicas` here would have kubectl/Flux
  # reassert it on every apply, fighting the HPA. Baseline is
  # minReplicaCount: 1 there, matching DESIGN.md §9.2's steady state.
  # Same memory trade-off as the api: never schedule an *extra* worker pod
  # during a rollout. Replicas are replaced one at a time, so with more than
  # one replica, old- and new-image workers do run side by side until the
  # rollout finishes (fine: both consume the same stream); the pod count
  # just never exceeds the current replica count.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: retrieval-worker
  template:
    metadata:
      labels:
        app: retrieval-worker
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        # Same gate as the api: wait until the migrate Job has brought the
        # database to this image's Alembic head. See api-deployment.yaml.
        - name: wait-for-migrations
          image: 404379474987.dkr.ecr.us-east-1.amazonaws.com/glassbox:latest
          command: ["python", "-m", "services.glassbox.db.wait_for_migrations", "--timeout", "300"]
          envFrom:
            - configMapRef:
                name: glassbox-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glassbox-mysql
                  key: mysql-password
          resources:
            # Measured peak RSS ~57 MiB. The pod's effective request is
            # max(init, main), so this adds nothing to the node's request total.
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: worker
          image: 404379474987.dkr.ecr.us-east-1.amazonaws.com/glassbox:latest
          command: ["python", "-m", "services.glassbox.worker.main"]
          envFrom:
            - configMapRef:
                name: glassbox-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glassbox-mysql
                  key: mysql-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
