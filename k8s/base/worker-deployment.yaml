apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-worker
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retrieval-worker
  template:
    metadata:
      labels:
        app: retrieval-worker
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: worker
          image: 404379474987.dkr.ecr.us-east-1.amazonaws.com/glassbox:latest
          command: ["python", "-m", "services.glassbox.worker.main"]
          envFrom:
            - configMapRef:
                name: glassbox-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glassbox-mysql
                  key: mysql-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
