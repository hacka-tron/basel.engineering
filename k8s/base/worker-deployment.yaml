apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-worker
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retrieval-worker
  template:
    metadata:
      labels:
        app: retrieval-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/hacka-tron/basel.engineering:9c03c06
          command: ["python", "-m", "services.glassbox.worker.main"]
          envFrom:
            - configMapRef:
                name: glassbox-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glassbox-mysql
                  key: mysql-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
