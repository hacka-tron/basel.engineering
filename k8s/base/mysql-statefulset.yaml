apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: data
spec:
  serviceName: mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          # Defaults OOMKilled at a 250Mi limit (innodb_buffer_pool_size
          # alone defaults to 128MB, before other buffers/threads). Tuned
          # down for a memory-constrained single node rather than just
          # raising the limit - see docs/DESIGN.md 9.7.
          args:
            - mysqld
            - --innodb-buffer-pool-size=96M
            - --innodb-log-buffer-size=4M
            - --key-buffer-size=8M
            - --max-connections=20
            - --table-open-cache=64
            - --performance-schema=OFF
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glassbox-mysql
                  key: mysql-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glassbox-mysql
                  key: mysql-password
            - name: MYSQL_USER
              value: glassbox
            - name: MYSQL_DATABASE
              value: glassbox
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              memory: 350Mi
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 10
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 4Gi
