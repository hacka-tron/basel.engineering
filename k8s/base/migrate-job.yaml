apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: app
  annotations:
    # Job pod templates are immutable - any change to the image tag makes a
    # normal patch fail outright ("field is immutable"), which blocked
    # Flux's very first reconcile against the pre-existing manually-created
    # Job. This tells Flux to delete and recreate instead of patching.
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: regcred
      containers:
        - name: migrate
          image: 404379474987.dkr.ecr.us-east-1.amazonaws.com/glassbox:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: glassbox-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glassbox-mysql
                  key: mysql-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
