apiVersion: v1
kind: ConfigMap
metadata:
  name: glassbox-config
  namespace: app
data:
  MYSQL_HOST: mysql.data.svc.cluster.local
  MYSQL_PORT: "3306"
  MYSQL_USER: glassbox
  MYSQL_DATABASE: glassbox
  REDIS_URL: redis://redis.data.svc.cluster.local:6379/0
  GLASSBOX_PROVIDER: bedrock
  AWS_REGION: us-east-1
  BEDROCK_EMBEDDING_MODEL_ID: amazon.titan-embed-text-v2:0
  BEDROCK_LLM_MODEL_ID: us.amazon.nova-lite-v1:0
  GLASSBOX_DAILY_LLM_CAP: "100"
  # Answer-cache warm-up: LLM calls per UTC day across all warm-up runs
  # (CronJob + post-deploy), out of the 100 above (services/glassbox/warm.py).
  GLASSBOX_WARM_DAILY_LLM_CAP: "10"
  GLASSBOX_TRUSTED_PROXY_CIDRS: "10.42.0.0/16"
