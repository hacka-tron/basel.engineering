name: Ops runbooks

# Push-button production operations: Actions -> "Ops runbooks" -> Run
# workflow. Pick an action from the list; the other inputs only matter for
# the action named in their description. There is no free-form command input
# on purpose: every action runs a Terraform-managed SSM document
# (infra/modules/ops) or one fixed EC2 call. What each action does and when
# to use it: infra/CI.md "Runbooks".
#
#   diagnose        read-only; runs straight away (ops-read environment,
#                   glassbox-ops-read role, no approval)
#   everything else first runs diagnose (the "before"), then waits for owner
#                   approval in the ops environment, acts with the
#                   glassbox-ops role, and runs diagnose again (the "after")

on:
  workflow_dispatch:
    inputs:
      action:
        description: Runbook action
        type: choice
        required: true
        default: diagnose
        options:
          - diagnose
          - reboot-node
          - restart-deployment
          - flux-suspend
          - flux-resume
          - flux-reconcile
          - scale-keda
          - cronjob-suspend
          - cronjob-resume
          - apply-zram
      deployment:
        description: restart-deployment only
        type: choice
        default: api
        options: [api, retrieval-worker, traefik]
      flux_target:
        description: flux-suspend / flux-resume only (helmrelease-keda = the keda HelmRelease)
        type: choice
        default: keda
        options: [keda, keda-scaling, ingest, app-ready, flux-system, helmrelease-keda]
      keda_replicas:
        description: scale-keda only
        type: choice
        default: "0"
        options: ["0", "1"]
      cronjob:
        description: cronjob-suspend / cronjob-resume only
        type: choice
        default: warm-answers
        options: [warm-answers]
      reason:
        description: Why (optional; shown in the run summary)
        type: string
        required: false

permissions:
  contents: read

# One operation at a time against the single node; never cancel one midway.
concurrency:
  group: ops-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ACTION: ${{ inputs.action }}
  DEPLOYMENT: ${{ inputs.deployment }}
  FLUX_TARGET: ${{ inputs.flux_target }}
  KEDA_REPLICAS: ${{ inputs.keda_replicas }}
  CRONJOB: ${{ inputs.cronjob }}
  REASON: ${{ inputs.reason }}

jobs:
  diagnose:
    name: diagnose (read-only)
    runs-on: ubuntu-latest
    environment: ops-read
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run ops runbooks from main only (this run is on $GITHUB_REF)."
          exit 1
      - uses: actions/checkout@v4
      - name: Run summary
        run: |
          {
            echo "## Ops runbook: \`$ACTION\`"
            echo
            echo "- Requested by: \`$GITHUB_ACTOR\`, commit \`${GITHUB_SHA::7}\`"
            case "$ACTION" in
              restart-deployment) echo "- Deployment: \`$DEPLOYMENT\`" ;;
              flux-suspend|flux-resume) echo "- Flux target: \`$FLUX_TARGET\`" ;;
              scale-keda) echo "- KEDA replicas: \`$KEDA_REPLICAS\`" ;;
              cronjob-suspend|cronjob-resume) echo "- CronJob: \`$CRONJOB\`" ;;
            esac
            if [ -n "$REASON" ]; then
              # REASON arrives via env (never interpolated here) and is redacted.
              printf -- '- Reason: %s\n' "$(printf '%s' "$REASON" | .github/scripts/ops-run.sh redact)"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Assume read-only ops role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::404379474987:role/glassbox-ops-read
          role-session-name: ops-diagnose-${{ github.run_id }}
      - name: Diagnose
        env:
          TITLE: ${{ inputs.action == 'diagnose' && 'diagnose' || 'diagnose (before)' }}
        run: .github/scripts/ops-run.sh diagnose "$TITLE"

  act:
    name: ${{ inputs.action }} (needs approval)
    needs: diagnose
    # Runs even when the "before" diagnose failed: a hung node is exactly
    # when reboot-node is needed.
    if: ${{ !cancelled() && inputs.action != 'diagnose' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: ops
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Assume ops role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::404379474987:role/glassbox-ops
          role-session-name: ops-${{ inputs.action }}-${{ github.run_id }}
      - name: Act
        run: .github/scripts/ops-run.sh act "$ACTION"
      - name: Diagnose (after)
        if: ${{ !cancelled() }}
        run: .github/scripts/ops-run.sh diagnose "diagnose (after)"
