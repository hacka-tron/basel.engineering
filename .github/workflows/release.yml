name: Release

on:
  push:
    branches: [main]
    paths:
      - services/**
      - frontend/**
      - pyproject.toml
      - Dockerfile
      - docker-compose.yml
      - k8s/base/**
      - .github/workflows/release.yml

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-push:
    # Native ARM64 runner, matching the EC2 node's Graviton architecture -
    # deliberately not an x86 runner cross-building via QEMU emulation,
    # which is what made the first real run of this workflow take 20+
    # minutes for what should be a normal-length build. Free for public
    # repos, same as ubuntu-latest.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/hacka-tron/basel.engineering:${{ steps.tag.outputs.tag }}
            ghcr.io/hacka-tron/basel.engineering:latest

  bump-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # A PAT, deliberately not the default GITHUB_TOKEN: GitHub doesn't
      # trigger other workflows for a push/PR made with the automatic
      # token (anti-loop protection), which would leave this PR's checks
      # never running and `gh pr merge --auto` waiting forever. A real
      # token identity doesn't have that restriction.
      GH_TOKEN: ${{ secrets.RELEASE_BOT_PAT }}
      TAG: ${{ needs.build-and-push.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_BOT_PAT }}
      - name: Set deployed image tag
        working-directory: k8s/overlays/prod
        run: yq -i '.images[0].newTag = "${{ env.TAG }}"' kustomization.yaml
      # main requires backend-tests/frontend-checks to pass, and a check run
      # can only exist for a commit that's already reachable on GitHub - a
      # raw `git push` straight to main is rejected outright (there's no way
      # for the checks to have run for a commit before it's been pushed
      # anywhere). Going through a real PR + auto-merge instead: ci.yml runs
      # against this PR's commit like any other, and GitHub merges it
      # automatically once that passes.
      - name: Open and auto-merge the deploy PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "deploy/${TAG}"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "deploy: bump image to ${TAG}"
          git push origin "deploy/${TAG}"
          gh pr create --base main --head "deploy/${TAG}" \
            --title "deploy: bump image to ${TAG}" \
            --body "Automated image tag bump from the release workflow."
          gh pr merge "deploy/${TAG}" --auto --merge --delete-branch
