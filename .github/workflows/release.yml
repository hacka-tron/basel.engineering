name: Release

on:
  # Manual runs are for rebuilding main's current head (e.g. after a failed
  # or flaky run). The provenance step refuses any other commit or ref, but
  # only on refs whose release.yml contains it: the real gate for old
  # branches/tags is the `release` environment restricted to `main`
  # (owner setting, see infra/CI.md "Release and the deploy branch").
  workflow_dispatch: {}
  push:
    branches: [main]
    # Every path the Dockerfile COPYs into the image, plus build inputs. The
    # image carries corpus/ docs/ infra/ k8s/ as the ingest Job's content
    # snapshot, so a docs- or corpus-only merge must still build a release,
    # or the new content never reaches the RAG index. Flux's tag bumps go to
    # the `deploy` branch, not main, so k8s/** here cannot loop.
    paths:
      - services/**
      - frontend/**
      - corpus/**
      - docs/**
      - infra/**
      - k8s/**
      - alembic.ini
      - pyproject.toml
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/release.yml

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-push:
    # Native ARM64 runner, matching the EC2 node's Graviton architecture -
    # deliberately not an x86 runner cross-building via QEMU emulation,
    # which is what made the first real run of this workflow take 20+
    # minutes for what should be a normal-length build. Free for public
    # repos, same as ubuntu-latest.
    runs-on: ubuntu-24.04-arm
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Flux deploys the highest build-N, and N (github.run_number) grows
      # with every run whatever commit it builds. So a manual run must be on
      # main and build main's current head, or it would mint the highest
      # number for a stale commit and Flux would roll production back to it.
      # Checked here, before AWS credentials or the build; push runs skip it.
      # (A re-run keeps its run_number, so it can't outrank newer builds; an
      # old manual run's re-run is refused anyway, its SHA no longer being
      # main's head.)
      - name: Check release provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: .github/scripts/release-provenance.sh
      # The owner's private About Basel repo (docs/DESIGN-003-ingestion.md §1.2),
      # baked into the image (private ECR) so the ingest Job indexes its
      # about-me/ Markdown as about_me, behind the personal-data guard. Read with
      # a read-only deploy key (ABOUT_ME_DEPLOY_KEY, a `release` environment
      # secret) that can read that one repo and nothing else. Without the secret
      # this is skipped and the image carries the public corpus only. Nothing
      # here prints file names or contents (no ls/cat/debug steps; the build log
      # shows only Dockerfile steps). corpus/about-me-private/ is in .gitignore,
      # and .dockerignore lets only its about-me/**/*.md into the image.
      - name: Private About Basel repo configured?
        id: about_me
        env:
          # Only whether the secret is set, never its value, reaches the shell.
          ABOUT_ME_CONFIGURED: ${{ secrets.ABOUT_ME_DEPLOY_KEY != '' }}
        run: |
          if [ "$ABOUT_ME_CONFIGURED" = true ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ABOUT_ME_DEPLOY_KEY is not set, so this build uses the public corpus only."
          fi
      # A configured key that fails (revoked, repo renamed) fails the release
      # rather than shipping an image without the private corpus; removing the
      # secret is the way to build without it. Either way the ingest's stale
      # sweep never deletes private documents it can't see (ingest/sweep.py).
      - name: Check out the private About Basel repo
        if: steps.about_me.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hacka-tron/basel.engineering-docs
          ssh-key: ${{ secrets.ABOUT_ME_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: corpus/about-me-private
      - id: tag
        # Also tags with a prefixed run number: short git SHAs have no
        # inherent ordering, but Flux's ImagePolicy needs to pick "the
        # newest" tag by sorting something. github.run_number is a plain,
        # always-increasing integer per workflow - the "build-" prefix is
        # load-bearing, not cosmetic: a bare numeric tag once collided with
        # an old commit's short SHA that happened to be all-digits
        # ("3842459"), which sorted higher than any real build number and
        # got deployed instead. The prefix makes that collision impossible.
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_number=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::404379474987:role/glassbox-ci-release
          role-session-name: release-${{ github.run_id }}
      # OIDC, not a stored secret - the same pattern the Terraform workflow
      # already uses for AWS. GHCR was tried first and abandoned: the
      # package was created by a human pushing manually, never had
      # reliable Actions-token write access even after explicitly granting
      # it in the package's own settings (confirmed by two separate failed
      # runs). ECR sidesteps that whole class of problem rather than
      # working around it.
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Two mutually exclusive build steps rather than one with a computed
      # cache-to: a GitHub expression like `cond && '' || 'x'` always yields
      # 'x' (an empty string is falsy), which once nearly exported the private
      # layer. Exactly one runs; services/tests/test_private_corpus.py checks
      # the conditions and that the private build has no cache settings at all.
      - name: Build and push (public corpus only)
        if: steps.about_me.outputs.configured != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record is a run artifact, downloadable on this public
          # repo's run page: keep it off.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/glassbox:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/glassbox:${{ steps.tag.outputs.build_number }}
            ${{ steps.ecr-login.outputs.registry }}/glassbox:latest
      # With the private corpus in the context: no GitHub Actions cache in either
      # direction (other runs in this public repo, fork PRs included, can restore
      # main's cache entries, so the private layer must never be exported), no
      # build record artifact and no job summary. Slower builds are the cost.
      - name: Build and push (with the private About Basel corpus)
        if: steps.about_me.outputs.configured == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/glassbox:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/glassbox:${{ steps.tag.outputs.build_number }}
            ${{ steps.ecr-login.outputs.registry }}/glassbox:latest

# No bump-manifest job. Flux's own image automation (bootstrapped
# separately, see project/AGENT_HANDOFF.md) watches the ECR repository
# directly and updates k8s/overlays/prod/kustomization.yaml itself, using
# its own git credential - not GitHub Actions'. That sidesteps two real
# problems the original design hit: a direct push to protected main is
# rejected outright (a brand-new commit can never already carry a passing
# check run for its own not-yet-pushed SHA), and a PR opened with the
# default GITHUB_TOKEN never triggers the checks needed to merge it
# (GitHub's anti-loop protection). This job's only responsibility is
# building and publishing the image; nothing here writes back to git.
