name: Release

on:
  push:
    branches: [main]
    paths:
      - services/**
      - frontend/**
      - pyproject.toml
      - Dockerfile
      - docker-compose.yml
      - k8s/base/**
      - .github/workflows/release.yml

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/hacka-tron/basel.engineering:${{ steps.tag.outputs.tag }}
            ghcr.io/hacka-tron/basel.engineering:latest

  bump-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set deployed image tag
        working-directory: k8s/overlays/prod
        run: |
          yq -i '.images[0].newTag = "${{ needs.build-and-push.outputs.tag }}"' kustomization.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "deploy: bump image to ${{ needs.build-and-push.outputs.tag }} [skip ci]"
          git push origin HEAD:main
