name: "Ops · List snapshots"

# Read-only: the node's daily snapshots (IDs and dates, for "Ops · Restore
# from snapshot"), the status-check alarms' states and recent restores.
# No approval. Thin wrapper: calls the reusable core (ops.yml).

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why (optional; shown in the public run summary, so no secrets)
        type: string
        required: false

# Reusable workflows can't raise permissions above the caller's.
permissions:
  contents: read
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/ops.yml
    with:
      action: list-snapshots
      reason: ${{ inputs.reason }}
