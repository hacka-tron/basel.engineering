name: CI

# No trigger path filters: backend-tests and frontend-checks are required
# status checks on main, and a workflow skipped by a path filter never
# reports them, so the PR would wait forever. Instead the `changes` job
# decides, and the test jobs skip themselves only for changes that touch
# process docs exclusively (a job skipped by `if:` counts as passing a
# required check). They run unless `changes` positively said "false", so a
# failed `changes` job runs the tests instead of skipping them. Process docs
# are project/** (except SNAPSHOT.md, which test_planned_labels reads) and
# repo-root *.md. docs/** still runs CI: it is chatbot corpus and tested.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/ci-code-changed.sh "$BASE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  backend-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root  # pragma: allowlist secret (throwaway CI service container)
          MYSQL_DATABASE: glassbox
          MYSQL_USER: glassbox
          MYSQL_PASSWORD: glassbox  # pragma: allowlist secret (throwaway CI service container)
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis/redis-stack-server:7.2.0-v11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: glassbox
      MYSQL_PASSWORD: glassbox  # pragma: allowlist secret (throwaway CI service container)
      MYSQL_DATABASE: glassbox
      REDIS_URL: redis://127.0.0.1:6379/0
      GLASSBOX_PROVIDER: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r services/requirements-dev.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Migration round trip (newest revision down, then up again)
        run: alembic downgrade -1 && alembic upgrade head
      - name: Ruff
        run: ruff check services eval
      - name: Pytest
        run: pytest services/tests -q -rs

  frontend-checks:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
