  # --------------------------------------------------------------- multi-turn
  - id: mt-stress-cooldown
    origin: new
    corpus: about_system
    category: multi_turn
    question: How long is the cooldown?
    history:
      - role: user
        content: What happens when I press stress test?
      - role: assistant
        content: >-
          The stress test floods the retrieval:jobs Redis Stream with synthetic jobs
          so KEDA scales the retrieval-worker Deployment from 1 to 3 pods and back.
          If the node lacks room, it plays a simulated burst instead.
    rewrite_must_include: ['stress']
    expected_sources: [docs/architecture/deep-dive.md]
    gold_snippets:
      - That is a 5-minute cooldown shared by every visitor.
    must_include: ['\b(5|five)[- ]?min|\bEX 300\b|\b300[- ]?s(ec(ond)?s?)?\b']
  - id: mt-keda-max
    origin: new
    corpus: about_system
    category: multi_turn
    holdout: true
    question: What is the most replicas it can scale to?
    history:
      - role: user
        content: How does KEDA autoscale the retrieval workers?
      - role: assistant
        content: >-
          KEDA watches the backlog of the retrieval:jobs Redis Stream and scales the
          retrieval-worker Deployment when jobs pile up.
    rewrite_must_include: ['KEDA|worker']
    expected_sources: [docs/architecture/deep-dive.md]
    gold_snippets:
      - 'maxReplicaCount: 3'
    must_include: ['\b(3|three)\b']
  - id: mt-cache-ttl
    origin: new
    corpus: about_system
    category: multi_turn
    question: How long are entries kept in the semantic one?
    history:
      - role: user
        content: Which Redis cache layers does Glassbox use?
      - role: assistant
        content: >-
          Glassbox uses an embedding cache, a retrieval cache, a chunk cache and a
          semantic answer cache, all in Redis.
    rewrite_must_include: ['answer|semantic']
    expected_sources: [docs/architecture/deep-dive.md]
    gold_snippets:
      - each stored with its answer and cited chunks for 24 hours
    must_include: ['\b24\b']
  - id: mt-rate-limit
