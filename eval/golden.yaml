# Golden answer dataset v2 (DESIGN-005 §5.1). Validated by eval/schema.py; graded
# by eval/graders.py; run with `python -m eval.run_answers` (see eval/README.md).
#
# Case fields:
#   id, corpus (about_me | about_system), category, question, origin
#   history: earlier turns, alternating user/assistant (multi_turn, some injection)
#   expected_sources: repo files that answer the question (file-level retrieval)
#   gold_snippets: text that must occur in one of the expected sources (case- and
#     whitespace-insensitive); phase 2 counts a retrieved chunk containing one as a hit
#   must_include: case-insensitive regexes for the key facts (fact_coverage)
#   must_not_include: regexes the answer must not match
#   rewrite_must_include: regexes the standalone follow-up rewrite must match
#   expect_abstain: the answer must be a refusal
#   holdout: kept out of prompt tuning (DESIGN-005 §8 "golden-set overfitting")
#   needs_owner_review: About Basel facts are claims about the owner; he reviews them
#
# The 30 cases with origin: questions.yaml are copied verbatim (same ids, questions
# and expected sources) so old and new retrieval numbers stay comparable.
version: 2
