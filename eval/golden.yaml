  - id: sugg-system-stress
    origin: suggested
    corpus: about_system
    category: fact
    notes: >-
      The BACKLOG "answer thinness" bug: the live v13 answer dropped the 512 MiB
      capacity rule and the 5-minute cooldown although both sit in one retrieved
      chunk. This case must fail on that answer and pass once phase 5 lands.
    question: What happens when I press stress test?
    expected_sources: [docs/architecture/deep-dive.md, docs/DESIGN.md]
    gold_snippets:
      - live free memory (allocatable minus current usage) is at least 512 MiB
      - That is a 5-minute cooldown shared by every visitor.
      - After a real burst the global 5-minute cooldown switches the icon to the bunny
    must_include: ['512\s?MiB', '\b(5|five)[- ]?min|\bEX 300\b|\b300[- ]?s(ec(ond)?s?)?\b', 'simulat']
